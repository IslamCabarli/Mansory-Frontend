<div class="bg-mansory-gray rounded-sm border border-mansory-light-gray p-6">
  <h3 class="text-xl font-heading font-semibold text-white mb-6">Manage Images</h3>

  <div class="mb-8 p-6 bg-mansory-black rounded border border-mansory-light-gray">
    <h4 class="text-white font-semibold mb-4">Upload New Images</h4>
    
    <div class="flex flex-col md:flex-row items-center gap-4">
      <input 
        type="file" 
        (change)="onFileSelected($event)"
        accept="image/*"
        multiple
        class="flex-1 w-full px-4 py-2 bg-mansory-gray border border-mansory-light-gray text-white rounded focus:border-mansory-gold focus:outline-none file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-mansory-gold file:text-black hover:file:bg-mansory-gold/90"
      />
      
      <button 
        (click)="uploadImages()"
        [disabled]="selectedFiles.length === 0 || isUploading()"
        class="w-full md:w-auto btn-luxury px-8 py-2 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
      >
        @if (isUploading()) {
          <svg class="animate-spin h-5 w-5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Uploading...</span>
        } @else {
          <span>Upload ({{ selectedFiles.length }})</span>
        }
      </button>
    </div>
  </div>

  @if (car.images && car.images.length > 0) {
    <div>
      <h4 class="text-white font-semibold mb-4">Current Images ({{ car.images.length }})</h4>
      
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        @for (image of car.images; track image.id) {
          <div class="relative group">
            <div class="aspect-video bg-mansory-black rounded overflow-hidden border border-transparent group-hover:border-mansory-gold/50 transition-all">
              <img 
                [src]="getImageUrl(image)" 
                [alt]="car.name"
                class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
              />
            </div>

            @if (image.is_primary) {
              <div class="absolute top-2 left-2 px-2 py-1 bg-mansory-gold text-black text-[10px] font-bold uppercase rounded shadow-lg">
                Primary
              </div>
            }

            <div class="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center gap-2 p-2">
              @if (!image.is_primary) {
                <button 
                  (click)="setPrimary(image)"
                  class="w-full py-1.5 bg-mansory-gold text-black text-xs font-bold rounded hover:bg-white transition-colors"
                >
                  SET PRIMARY
                </button>
              }
              
              <button 
                (click)="deleteImage(image)"
                class="w-full py-1.5 bg-red-600 text-white text-xs font-bold rounded hover:bg-red-700 transition-colors"
              >
                DELETE
              </button>
            </div>
          </div>
        }
      </div>
    </div>
  } @else {
    <div class="text-center py-12 bg-mansory-black/50 rounded-sm border border-dashed border-gray-700">
      <p class="text-gray-500">No images available for this vehicle.</p>
    </div>
  }
</div>
